# Langfuse Helm values for OpenShift production deployment
# Used by deploy-traces-langfuse.sh
#
# Production config: 3 replica ClickHouse, 3 replica ZooKeeper
# 11 pods total: web, worker, postgres, 3x clickhouse, redis, s3/minio, 3x zookeeper

langfuse:
  salt:
    secretKeyRef:
      name: langfuse-general
      key: salt
  nextauth:
    url: "PLACEHOLDER_URL"
    secret:
      secretKeyRef:
        name: langfuse-nextauth-secret
        key: nextauth-secret

postgresql:
  auth:
    username: langfuse
    existingSecret: langfuse-postgresql-auth
    secretKeys:
      userPasswordKey: password

clickhouse:
  replicaCount: 3
  auth:
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: password
  # Allow nondeterministic mutations for trace deletion
  usersdFiles:
    allow_mutations.xml: |
      <clickhouse>
        <profiles>
          <default>
            <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
          </default>
        </profiles>
      </clickhouse>
  zookeeper:
    replicaCount: 3

redis:
  auth:
    existingSecret: langfuse-redis-auth
    existingSecretPasswordKey: password

s3:
  auth:
    existingSecret: langfuse-s3-auth
    rootUserSecretKey: rootUser
    rootPasswordSecretKey: rootPassword
