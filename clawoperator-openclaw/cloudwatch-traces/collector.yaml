# The gateway sends OTLP/HTTP spans to this collector. MLflow receives the
# original payload; only the CloudWatch branch removes content-bearing fields.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch/mlflow:
    send_batch_size: 128
    timeout: 5s
  batch/cloudwatch:
    send_batch_size: 128
    timeout: 5s
  filter/cloudwatch-events:
    # Span events can contain arbitrary prompt and tool data.
    trace_conditions:
      - spanevent.name != nil
  transform/cloudwatch:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          # Allowlist metadata; never send prompt, response, or tool bodies.
          - keep_keys(span.attributes, ["gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.usage.total_tokens", "gen_ai.token.type", "openclaw.namespace", "openclaw.agent.id", "error.type", "http.response.status_code"])
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - set(span.links, nil)
          - set(instrumentation_scope.attributes, nil)
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.namespace", "openclaw.namespace"])

extensions:
  sigv4auth/cloudwatch:
    region: ${env:AWS_REGION}
    service: xray
    assume_role:
      arn: ${env:AWS_ROLE_ARN}
      sts_region: ${env:AWS_REGION}
      web_identity_token_file: /var/run/secrets/aws/token

exporters:
  otlp_http/mlflow:
    traces_endpoint: http://mlflow-mlflow.mlflow.svc.cluster.local:5000/v1/traces
    headers:
      x-mlflow-experiment-id: "1"
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  otlp_http/cloudwatch:
    traces_endpoint: https://xray.${env:AWS_REGION}.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/cloudwatch
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  extensions: [sigv4auth/cloudwatch]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/mlflow:
      receivers: [otlp]
      processors: [memory_limiter, batch/mlflow]
      exporters: [otlp_http/mlflow]
    traces/cloudwatch:
      receivers: [otlp]
      processors: [memory_limiter, filter/cloudwatch-events, transform/cloudwatch, batch/cloudwatch]
      exporters: [otlp_http/cloudwatch]
