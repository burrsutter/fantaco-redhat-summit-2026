<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Get a Claw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 480px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #4ecdc4; }
    p { font-size: 1.1rem; line-height: 1.6; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You Get a Claw!</h1>
    <p>Scan the QR code on screen to get your OpenClaw instance.</p>
  </div>
</body>
</html>
